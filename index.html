<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simple Calculator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="calculator">
    <!-- Display Screen -->
    <div class="display">
      <div id="previous"></div>
      <div id="current">0</div>
    </div>

    <!-- Keypad -->
    <div class="keypad">
      <!-- Row 1 -->
      <button id="clear" class="btn action">AC</button>
      <button id="delete" class="btn action">DEL</button>
      <button id="percent" class="btn action">%</button>
      <button class="btn operator">/</button>

      <!-- Row 2 -->
      <button class="btn number">7</button>
      <button class="btn number">8</button>
      <button class="btn number">9</button>
      <button class="btn operator">*</button>

      <!-- Row 3 -->
      <button class="btn number">4</button>
      <button class="btn number">5</button>
      <button class="btn number">6</button>
      <button class="btn operator">-</button>

      <!-- Row 4 -->
      <button class="btn number">1</button>
      <button class="btn number">2</button>
      <button class="btn number">3</button>
      <button class="btn operator">+</button>

      <!-- Row 5 -->
      <button class="btn number zero">0</button>
      <button class="btn number">.</button>
      <button id="equals" class="btn equals">=</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
